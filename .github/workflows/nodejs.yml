# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Node.js CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.3
      - run: npm ci
      - name: Audit root dependencies
        run: |
          npm audit --json > /tmp/root-audit.json || true
          node -e 'const a=require("/tmp/root-audit.json"); for (const [n,v] of Object.entries(a.vulnerabilities || {})) console.log(JSON.stringify({package:n,severity:v.severity,range:v.range,via:v.via.map(x=>typeof x === "string" ? x : {title:x.title,url:x.url,range:x.range}),fixAvailable:v.fixAvailable})); console.log("ROOT_AUDIT_TOTALS", JSON.stringify(a.metadata?.vulnerabilities || {}))'
      - name: Verify standalone email service package
        working-directory: email-service
        run: |
          npm ci
          npm audit --json > /tmp/email-service-audit.json || true
          node -e 'const a=require("/tmp/email-service-audit.json"); for (const [n,v] of Object.entries(a.vulnerabilities || {})) console.log(JSON.stringify({package:n,severity:v.severity,range:v.range,via:v.via.map(x=>typeof x === "string" ? x : {title:x.title,url:x.url,range:x.range}),fixAvailable:v.fixAvailable})); console.log("EMAIL_SERVICE_AUDIT_TOTALS", JSON.stringify(a.metadata?.vulnerabilities || {}))'
          npm run typecheck
          npm test
      - run: npm run build --if-present
        env:
          CI: true
          NODE_ENV: production
      - name: Verify CoWatch remote email integration
        run: |
          npm run test:email-service-api
          npm run test:email-service-gateway
          npm run test:duplicate-signup-security
