<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0a0d14">
  <title>Page Not Found | CoWatch</title>
  <style>
    :root { color-scheme: dark light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0a0d14; color: #f5f3ff; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: radial-gradient(ellipse at 50% 0, #292044 0, #0a0d14 58%); }
    main { width: min(100%, 560px); padding: 48px 32px; text-align: center; border: 1px solid #373149; border-radius: 24px; background: rgba(17, 21, 34, .92); box-shadow: 0 24px 80px rgba(0, 0, 0, .28); }
    .brand { margin: 0 0 28px; font-size: 18px; font-weight: 800; letter-spacing: -.04em; }
    .brand span { color: #b69cff; }
    .code { margin: 0; font-size: clamp(76px, 18vw, 112px); line-height: .95; font-weight: 850; letter-spacing: -.08em; color: #b69cff; }
    h1 { margin: 20px 0 10px; font-size: clamp(24px, 5vw, 32px); letter-spacing: -.04em; }
    p { margin: 0 auto; max-width: 390px; color: #b8b5c7; line-height: 1.65; }
    nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 30px; }
    a { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 18px; border: 1px solid #51466d; border-radius: 10px; color: #f5f3ff; font-weight: 650; text-decoration: none; }
    a.primary { border-color: transparent; color: #fff; background: linear-gradient(135deg, #8b5cf6, #d946ef); }
    a:focus-visible { outline: 3px solid #b69cff; outline-offset: 3px; }
    @media (prefers-color-scheme: light) {
      :root { color-scheme: light; background: #f0f3f8; color: #171525; }
      body { background: radial-gradient(ellipse at 50% 0, #e8ddff 0, #f0f3f8 58%); }
      main { border-color: #e0dbea; background: rgba(255, 255, 255, .94); box-shadow: 0 24px 80px rgba(31, 24, 50, .1); }
      p { color: #5d586d; }
      a { border-color: #d8cdeb; color: #30264a; }
    }
  </style>
</head>
<body>
  <main>
    <p class="brand">Co<span>Watch</span></p>
    <p class="code" aria-hidden="true">404</p>
    <h1>We couldn't find that page</h1>
    <p>The link may be incorrect, or the page may have moved. Head back to CoWatch or visit support for help.</p>
    <nav aria-label="Helpful links">
      <a class="primary" href="/">Go to CoWatch</a>
      <a href="/support">Help &amp; Support</a>
    </nav>
  </main>
</body>
</html>
