# CoWatch Distributed Shard Routing Reference Configuration (NGINX)
# Invariant: Each roomId maps to exactly one authoritative shard worker (shard1 on :3001, shard2 on :3002).
# Absence of @socket.io/redis-adapter requires 100% ingress routing affinity by roomId.

upstream cowatch_shard_1 {
    server 127.0.0.1:3001;
    keepalive 64;
}

upstream cowatch_shard_2 {
    server 127.0.0.1:3002;
    keepalive 64;
}

# Map roomId first character modulo shard count (2 shards)
# ASCII code % 2:
# Even ASCII characters -> Shard 1 (:3001)
# Odd ASCII characters  -> Shard 2 (:3002)
map $target_room_id $cowatch_shard_upstream {
    default cowatch_shard_1;
    ~^[ACEGIKMOQSUWYacegikmoqsuwy13579] cowatch_shard_1;
    ~^[BDFHJLNPRTVXZbdfhjlnprtvxz02468] cowatch_shard_2;
}

server {
    listen 80;
    server_name cowatch.local;

    # Extract target room ID from WebSocket namespace path or query argument
    set $target_room_id "";
    if ($uri ~ ^/([a-zA-Z0-9_\-]+)) {
        set $target_room_id $1;
    }
    if ($arg_roomId ~ ^([a-zA-Z0-9_\-]+)) {
        set $target_room_id $1;
    }

    # WebSocket / Socket.IO ingress
    location /socket.io/ {
        proxy_pass http://$cowatch_shard_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Dynamic room routes
    location / {
        proxy_pass http://$cowatch_shard_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
